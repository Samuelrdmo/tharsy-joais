# Mantém o projeto Supabase (plano free) ativo: ele pausa após ~7 dias sem acesso.
# A cada 5 dias faz uma consulta leve e pública (1 categoria) pela API.
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               ex.: https://seu-projeto.supabase.co
#   SUPABASE_PUBLISHABLE_KEY   a mesma chave pública usada no site (nunca a service_role)
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */5 * *' # dias 1, 6, 11, 16, 21, 26 e 31 de cada mês, 9h em Brasília
  workflow_dispatch: # permite rodar na mão em Actions → "Run workflow"

permissions:
  actions: write # para o passo que reativa este agendamento
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure os segredos SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY."; exit 1
          fi
          # --retry cobre instabilidades rápidas; falha final dispara o e-mail de erro do GitHub.
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 20 \
            "${SUPABASE_URL%/}/rest/v1/categories?select=name&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status: $(cat response.json)"
          if [ "$status" -ge 300 ]; then
            echo "::error::O Supabase respondeu $status. Se o projeto estiver pausado, reative em supabase.com/dashboard."; exit 1
          fi

      # Em repositórios públicos o GitHub desliga agendamentos após 60 dias sem commits.
      # Reativar o próprio workflow a cada execução reinicia essa contagem.
      - name: Manter o agendamento ligado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-supabase-alive.yml --repo "$GITHUB_REPOSITORY"
